<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PingLater Quick Menu</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">PingLater</h1>
          <span class="brand-tag">Never forget a follow-up</span>
        </div>
      </div>
      <span id="popupStatusBadge" class="status-indicator status-idle">Ready</span>
    </header>

    <!-- Active / Overdue Highlight Card -->
    <div id="activeBatchCard" class="card-highlight hidden">
      <div class="highlight-top">
        <span class="highlight-label">CURRENT TASK</span>
        <span id="popupBatchStatus" class="highlight-badge">Due Now</span>
      </div>
      <h3 id="popupBatchTitle" class="highlight-title">Webinar Invites</h3>
      <div class="highlight-meta">
        <div class="progress-bar-mini">
          <div id="popupProgressFill" class="progress-bar-mini-fill" style="width: 0%"></div>
        </div>
        <div class="meta-counts">
          <span id="popupCounts">0 of 0 processed</span>
          <span id="popupPercent">0%</span>
        </div>
      </div>
      <button id="btnLaunchActiveInSidepanel" class="btn btn-primary full-width">
        ▶ Open in Side Panel
      </button>
    </div>

    <!-- Idle / Next Up Card (Shown when no active batch) -->
    <div id="idleStateCard" class="card-idle">
      <div class="idle-icon">⏰</div>
      <div class="idle-info">
        <strong id="idleHeaderTitle">All follow-ups caught up</strong>
        <p id="idleSubtext">No batches currently due. Ready to plan your next outreach?</p>
      </div>
    </div>

    <!-- Quick Action Launchers -->
    <div class="actions-list">
      <button id="btnPopupDashboard" class="action-btn">
        <div class="action-icon action-icon-blue">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
        </div>
        <div class="action-text">
          <strong>Open Full Dashboard</strong>
          <span>Manage batches, contacts & templates</span>
        </div>
        <span class="chevron">›</span>
      </button>

      <button id="btnPopupNewBatch" class="action-btn">
        <div class="action-icon action-icon-green">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
        </div>
        <div class="action-text">
          <strong>New Batch Campaign</strong>
          <span>Upload CSV and schedule follow-ups</span>
        </div>
        <span class="chevron">›</span>
      </button>

      <button id="btnPopupQuickPing" class="action-btn">
        <div class="action-icon action-icon-amber">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="action-text">
          <strong>Quick 1-to-1 Follow-up</strong>
          <span>Schedule a single message reminder</span>
        </div>
        <span class="chevron">›</span>
      </button>
    </div>

    <!-- Quick 1-to-1 Inline Collapsible Drawer -->
    <div id="quickPingDrawer" class="quick-ping-drawer hidden">
      <div class="drawer-header">
        <h4>⚡ Quick 1-to-1 Follow-up</h4>
        <button id="btnCloseDrawer" class="drawer-close">&times;</button>
      </div>
      <div class="drawer-body">
        <input type="text" id="popupSingleName" class="popup-input" placeholder="Name (e.g. Robin Sharma)">
        <input type="tel" id="popupSinglePhone" class="popup-input" placeholder="Phone (e.g. +91 91234 56789)">
        <textarea id="popupSingleMessage" rows="3" class="popup-input" placeholder="Hi {{name}}, checking in on our discussion..."></textarea>
        <div class="drawer-footer">
          <button id="btnPopupSaveSingle" class="btn btn-primary btn-sm full-width">
            Schedule for Tomorrow
          </button>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>PingLater • #365Days365Products Day 2</span>
      <button id="btnPopupTestChime" class="icon-link" title="Test Chime">🔔</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
